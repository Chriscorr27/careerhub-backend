name: CareerHub CD

on:
  workflow_run:
    workflows:
      - CareerHub CI
    types:
      - completed

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable image
        run: |
          docker pull ghcr.io/chriscorr27/careerhub-backend:${{ github.event.workflow_run.head_sha }}
      - name: Verify image
        run: |
          docker image inspect \
            ghcr.io/chriscorr27/careerhub-backend:${{ github.event.workflow_run.head_sha }}