# Spring Application
spring.application.name=careerhub-backend

# MySQL DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MongoDB
spring.data.mongodb.uuid-representation=standard

# Server
server.port=8000

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT Application Properties
app.jwt.secret=testiBmqIz45bsXngI6PznPdJgYov78Y
app.jwt.aws-access-token-expiration-minutes=2
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7


# Kafka Producer
spring.kafka.template.default-topic=careerhub
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.chrion.careerhub.*

# AWS S3
aws.s3.files-bucket-name=test-bucket
aws.s3.watermark-files-bucket-name=test-watermark-bucket
aws.s3.profiles-bucket-name=test-bucket
aws.s3.region=test-region
aws.s3.get-object-duration.minutes=10
aws.s3.put-object-duration.minutes=60
aws.cloud-front.url=https:/test-cloudfront.com
aws.secret=test-secret
aws.hashing.algorithm=HmacSHA256

# AWS SES
aws.ses.region=test-region
aws.ses.from-email=test@chrion.com

# File Upload

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.threads.virtual.enabled=true

# ADMIN CRED
app.admin.email=test-admin@chrion.com
app.admin.password=testAdmin